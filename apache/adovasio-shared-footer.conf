# Adovasio shared footer
#
# Install this file once as a global Apache configuration. Adjust the six
# document-root definitions to match the live checkouts before enabling it.

Define ADOVASIO_MAIN_ROOT "/var/www/portal"
Define ADOVASIO_INDEX_ROOT "/var/www/index.adovasio.com"
Define ADOVASIO_SOC_ROOT "/var/www/soc.adovasio.com"
Define ADOVASIO_TIME_ROOT "/var/www/time.adovasio.com"
Define ADOVASIO_TOOLS_ROOT "/var/www/tools.adovasio.com"
Define ADOVASIO_CONNECT_ROOT "/var/www/connect.adovasio.com"

# These aliases are declared in global server context so every Adovasio vhost
# resolves the same URL to files in the Main-Site checkout.
Alias "/_adovasio-shared/footer/" "${ADOVASIO_MAIN_ROOT}/shared/footer/"
Alias "/_adovasio-shared/assets/" "${ADOVASIO_MAIN_ROOT}/assets/"

<Directory "${ADOVASIO_MAIN_ROOT}/shared/footer">
    Options -Indexes
    AllowOverride None
    Require all granted
</Directory>

<Directory "${ADOVASIO_MAIN_ROOT}/assets">
    Options -Indexes
    AllowOverride None
    Require all granted
</Directory>

# SSI responses intentionally have no validators tied only to the consumer
# HTML file. The included footer can change independently after a Main-Site
# pull, so clients and intermediary caches must revalidate the response.
<Directory "${ADOVASIO_MAIN_ROOT}">
    Options +IncludesNOEXEC
    AddOutputFilter INCLUDES .html
    SSIETag Off
    SSILastModified Off
    <FilesMatch "\.html$">
        Header always set Cache-Control "no-cache, must-revalidate"
    </FilesMatch>
</Directory>

<Directory "${ADOVASIO_INDEX_ROOT}">
    Options +IncludesNOEXEC
    AddOutputFilter INCLUDES .html
    SSIETag Off
    SSILastModified Off
    <FilesMatch "\.html$">
        Header always set Cache-Control "no-cache, must-revalidate"
    </FilesMatch>
</Directory>

<Directory "${ADOVASIO_SOC_ROOT}">
    Options +IncludesNOEXEC
    AddOutputFilter INCLUDES .html
    SSIETag Off
    SSILastModified Off
    <FilesMatch "\.html$">
        Header always set Cache-Control "no-cache, must-revalidate"
    </FilesMatch>
</Directory>

<Directory "${ADOVASIO_TIME_ROOT}">
    Options +IncludesNOEXEC
    AddOutputFilter INCLUDES .html
    SSIETag Off
    SSILastModified Off
    <FilesMatch "\.html$">
        Header always set Cache-Control "no-cache, must-revalidate"
    </FilesMatch>
</Directory>

<Directory "${ADOVASIO_TOOLS_ROOT}">
    Options +IncludesNOEXEC
    AddOutputFilter INCLUDES .html
    SSIETag Off
    SSILastModified Off
    <FilesMatch "\.html$">
        Header always set Cache-Control "no-cache, must-revalidate"
    </FilesMatch>
</Directory>

<Directory "${ADOVASIO_CONNECT_ROOT}">
    Options +IncludesNOEXEC
    AddOutputFilter INCLUDES .html
    SSIETag Off
    SSILastModified Off
    <FilesMatch "\.html$">
        Header always set Cache-Control "no-cache, must-revalidate"
    </FilesMatch>
</Directory>

<LocationMatch "^/_adovasio-shared/">
    Header always set Cache-Control "no-cache, must-revalidate"
</LocationMatch>


